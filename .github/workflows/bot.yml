name: crypto-news-bot

on:
  schedule:
    # 10분 간격이되 **정각·10분 단위를 피해 7분씩 밀어둔다**.
    # GitHub 은 :00 같은 '둥근' 시각에 예약이 몰려 그 슬롯을 가장 심하게 지연시킨다.
    # 실측(2026-08-27): "*/10" 설정인데 실제 실행은 하루 6~32회, 간격 중앙값 42분.
    # 오프셋을 주는 건 GitHub 이 권고하는 완화책이다. 그래도 무료 티어는 best-effort 라
    # 간격을 보장하지 못한다 — 그래서 RUN_BUDGET_SEC 로 '한 번에 더 처리'를 함께 건다.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: poll
        options: [poll, digest]

# 동시 실행되면 상태 DB(botstate.sqlite3)가 꼬이므로 직렬화한다.
concurrency:
  group: crypto-news-bot
  cancel-in-progress: false

permissions:
  contents: write   # 상태 DB 커밋용

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 뉴스 수집·발행 1회
        env:
          PYTHONUNBUFFERED: "1"   # 없으면 로그가 버퍼에 갇혀 취소 시 아무것도 안 남는다
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE || '4' }}
          # 과거 기사는 끌어오지 않는다 — 최신만 발행
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '12' }}
          USE_TOPICS: "true"
          # 한 번 실행에서 쓸 수 있는 시간 상한(초). 이 시간을 넘기면 남은 항목은
          # 다음 실행으로 미룬다. job 타임아웃에 걸려 통째로 취소되면 발행 이력이
          # 저장되지 않아 다음 실행이 같은 뉴스를 다시 발행하게 되므로, 그 전에 스스로 끊는다.
          #
          # 600 → 840 (2026-08-27). 요약 상한이 이 값에서 계산된다(600→72건, 840→100건).
          # GitHub 이 하루 6회밖에 안 돌리는 날이 있는데, 72건 상한이면 6×72=432건이라
          # Gemini 일일 한도(560건)를 다 못 쓰고 남긴다. 100건으로 올려야 한도를 채운다.
          # 실행이 잦은 날엔 어차피 한도가 먼저 막으므로 부작용이 없다.
          # 840초 = 14분. 체크아웃·설치를 더해도 job 타임아웃 20분 안에 들어온다.
          RUN_BUDGET_SEC: "840"
        run: python main.py --once

      # 매시 정시 직후 실행분에서만 지난 1시간을 정리한다.
      # (10분 주기라 정시 실행은 시간당 한 번뿐이고, digest_log 로 중복도 막는다)
      - name: 시간별 다이제스트
        if: github.event.inputs.mode == 'digest' || github.event_name == 'schedule'
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          USE_TOPICS: "true"
        run: |
          # KST 기준 분(minute)이 10분 미만일 때만 = 매시 첫 실행
          MIN=$(TZ=Asia/Seoul date +%-M)
          if [[ "${{ github.event.inputs.mode }}" == "digest" || "$MIN" -lt 10 ]]; then
            python main.py --digest
          else
            echo "정시 실행이 아님(분=$MIN) — 다이제스트 생략"
          fi

      - name: 발행 이력 저장
        # 실패·취소되더라도 이미 발행한 것까지는 반드시 기록해야 중복 발행을 막는다.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain botstate.sqlite3)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add botstate.sqlite3
            git commit -m "chore: 발행 이력 갱신 [skip ci]"
            # 다른 실행이 먼저 푸시했을 수 있으므로 rebase 후 재시도
            git pull --rebase --autostash || true
            git push
          else
            echo "새 발행 없음 — 커밋 생략"
          fi
