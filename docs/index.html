<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoNews 봇 콘솔</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛰</text></svg>">
<style>
:root{
  --paper:#FBFAF7; --surface:#FFFFFF; --sunk:#F3F1EC;
  --ink:#14161C; --ink-2:#4A4F5C; --ink-3:#7C818E;
  --rule:#E3E0D8; --rule-2:#CFCBC0;
  --patina:#2F7A6F; --ok:#3F7A3A; --warn:#9A6A0C; --bad:#A33A32;
  --ok-bg:#EAF2E8; --warn-bg:#F7EFDD; --bad-bg:#F7E9E7;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1218; --surface:#171B23; --sunk:#12161D;
  --ink:#E8EAF0; --ink-2:#A7AEBD; --ink-3:#767E8F;
  --rule:#262C38; --rule-2:#333B4A;
  --patina:#5FB3A4; --ok:#6FB765; --warn:#D2A03F; --bad:#E0736A;
  --ok-bg:#152318; --warn-bg:#2A2113; --bad-bg:#2A1715;
}}
:root[data-theme="dark"]{
  --paper:#0F1218; --surface:#171B23; --sunk:#12161D;
  --ink:#E8EAF0; --ink-2:#A7AEBD; --ink-3:#767E8F;
  --rule:#262C38; --rule-2:#333B4A;
  --patina:#5FB3A4; --ok:#6FB765; --warn:#D2A03F; --bad:#E0736A;
  --ok-bg:#152318; --warn-bg:#2A2113; --bad-bg:#2A1715;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:24px}
h1,h2{margin:0;font-weight:640;text-wrap:balance}
a{color:var(--patina)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
nav a{padding:5px 10px;border:1px solid var(--rule);border-radius:2px;text-decoration:none;color:var(--ink-2)}
nav a[aria-current]{border-color:var(--patina);color:var(--patina)}
nav .sp{margin-left:auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 22px;padding:20px 22px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);border-left:4px solid var(--state,var(--ink-3))}
.verdict h1{font-size:26px;letter-spacing:-.015em}
.metrics{display:flex;flex-wrap:wrap;gap:6px 26px;margin-left:auto}
.metric{display:flex;flex-direction:column}
.metric b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
.metric span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.panel{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel h2{font-size:14px}
.note{color:var(--ink-3);font-size:12.5px;line-height:1.5}
.pill{display:inline-flex;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:2px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--sunk);color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 8px 7px 0;border-bottom:1px solid var(--rule)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow:auto;max-height:420px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
.bar .track{height:8px;background:var(--sunk);border-radius:1px;overflow:hidden}
.bar .fill{height:100%;background:var(--patina)}
.bar .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark i{flex:1;background:var(--patina);opacity:.85;border-radius:1px 1px 0 0;min-height:2px}
.spark i.late{background:var(--warn)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:2px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--patina);color:var(--patina)}
:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
input[type=search]{min-width:180px;flex:1}
pre{margin:0;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--ink-2)}
.cmd{display:flex;gap:8px;align-items:flex-start}.cmd pre{flex:1;min-width:0}
footer{border-top:1px solid var(--rule);padding-top:16px;color:var(--ink-3);font-size:12.5px;display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between}
#chart{width:100%;height:140px;display:block}
.err{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);padding:12px 14px;border-radius:3px;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="./" aria-current="page">상태</a>
    <a href="./handoff.html">인수인계</a>
    <span class="sp"></span>
    <button id="reload">새로고침</button>
    <button id="dl">상태 내려받기</button>
  </nav>

  <div id="boot" class="note">불러오는 중…</div>
  <div id="app" hidden>
    <div class="verdict" id="verdict"></div>

    <div class="grid" style="margin-top:24px">
      <section class="panel">
        <header><h2>누적 발행 추이</h2><span class="eyebrow" id="hist-label"></span></header>
        <canvas id="chart"></canvas>
        <p class="note" id="hist-note"></p>
      </section>
      <section class="panel">
        <header><h2>폴링 리듬</h2><span class="eyebrow" id="rhythm-label"></span></header>
        <div class="spark" id="spark"></div>
        <p class="note" id="rhythm-note"></p>
      </section>
      <section class="panel">
        <header><h2>클라우드 실행</h2><span class="eyebrow">최근 8회</span></header>
        <div class="scroll"><table id="runs"></table></div>
        <p class="note">취소(cancelled)는 대기열에서 밀려난 것으로 실패가 아니다. 판단 기준은 발행 이력이 쌓이는지다.</p>
      </section>
      <section class="panel">
        <header><h2>탭별 발행</h2><span class="eyebrow" id="cat-total"></span></header>
        <div class="bars" id="cats"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:18px">
      <header><h2>최근 발행</h2><span class="eyebrow" id="pub-count"></span></header>
      <div class="controls">
        <select id="f-cat"><option value="">모든 탭</option></select>
        <input type="search" id="f-q" placeholder="헤드라인 검색">
        <button id="f-mirror" data-on="0">미러만</button>
        <button id="f-reset">초기화</button>
      </div>
      <div class="scroll"><table id="pubs"></table></div>
    </section>

    <section class="panel" style="margin-top:18px">
      <header><h2>백업과 롤백</h2><span class="eyebrow" id="bk-root"></span></header>
      <div id="backups"></div>
      <div class="cmd"><pre id="restore-cmd"></pre><button id="copy">복사</button></div>
      <p class="note"><b>로컬 폴더만 되돌리면 절반이다.</b> GitHub Actions 시크릿(<code>TELEGRAM_BOT_TOKEN</code>)도 함께 되돌려야 클라우드가 옛 봇으로 돌아간다.</p>
    </section>

    <footer>
      <span>스냅샷 <span class="mono" id="gen"></span> · 히스토리 <span class="mono" id="hist-n"></span>줄</span>
      <span>봇이 폴링할 때마다 자동 갱신된다</span>
    </footer>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;};
const hhmm=i=>i?i.slice(5,16).replace('T',' '):'—';
const agoMin=i=>i?Math.round((Date.now()-new Date(i).getTime())/60000):null;
const dur=m=>m==null?'—':m<60?`${m}분`:`${Math.floor(m/60)}시간 ${m%60}분`;
let D=null,H=[];

async function load(){
  const bust=`?t=${Date.now()}`;
  const [s,h]=await Promise.all([
    fetch('status.json'+bust).then(r=>r.ok?r.json():Promise.reject(r.status)),
    fetch('history.jsonl'+bust).then(r=>r.ok?r.text():'').catch(()=>''),
  ]);
  D=s;
  H=h.split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
  render();
}

function render(){
  $('#boot').hidden=true; $('#app').hidden=false;
  const last=D.db.recent?.[0], mins=agoMin(last?.when);
  const running=(D.actions.runs||[]).some(r=>r.status==='in_progress');
  let state,word,why;
  if(mins==null){state='var(--ink-3)';word='기록 없음';why='발행 이력이 비어 있다.';}
  else if(mins<=45&&running){state='var(--ok)';word='정상 가동';why=`루프가 돌고 있고 마지막 발행이 ${dur(mins)} 전이다.`;}
  else if(mins<=90){state='var(--warn)';word='느려짐';why=`마지막 발행이 ${dur(mins)} 전이다. 폴링이 밀리고 있다.`;}
  else{state='var(--bad)';word='멈춤 의심';why=`마지막 발행이 ${dur(mins)} 전이다. 실행 상태와 한도를 확인할 것.`;}
  const v=$('#verdict');v.replaceChildren();v.style.setProperty('--state',state);
  const L=el('div');L.append(el('div','eyebrow','CryptoNews 봇 상태'));
  const h1=el('h1',null,word);h1.style.color=state;L.append(h1,el('div','note',why));
  const M=el('div','metrics');
  const add=(n,l)=>{const b=el('div','metric');b.append(el('b',null,n),el('span',null,l));M.append(b);};
  add(D.db.published??'—','누적 발행');add(D.db.seen??'—','수집');
  add(D.rhythm.count??0,'이력 커밋');add(running?'가동':'대기','루프');
  v.append(L,M);

  drawChart();

  const gaps=(D.rhythm.gaps||[]).slice().reverse(),max=Math.max(30,...gaps),sp=$('#spark');
  sp.replaceChildren();
  gaps.forEach(g=>{const i=el('i');i.style.height=`${Math.max(4,g/max*56)}px`;if(g>30)i.className='late';i.title=`${g}분`;sp.append(i);});
  const med=gaps.length?gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)]:null;
  $('#rhythm-label').textContent=med!=null?`중앙값 ${med}분`:'자료 없음';
  $('#rhythm-note').textContent=med==null?'발행 이력이 아직 없다.':`설정은 전체 스윕 20분 · 긴급 레인 5분. 30분 넘는 막대는 주황이다.`;

  const t=$('#runs');t.replaceChildren();
  const hr=el('tr');['#','시각','상태','길이','코드'].forEach(x=>hr.append(el('th',null,x)));t.append(hr);
  (D.actions.runs||[]).slice(0,8).forEach(r=>{
    const tr=el('tr');tr.append(el('td','mono',r.number),el('td','mono',hhmm(r.when)));
    const cls=r.status==='in_progress'||r.conclusion==='success'?'ok':r.conclusion==='cancelled'?'mute':r.conclusion?'bad':'mute';
    const lab=r.status==='in_progress'?'진행 중':['pending','queued'].includes(r.status)?'대기':r.conclusion==='success'?'성공':r.conclusion==='cancelled'?'취소':(r.conclusion||r.status);
    const td=el('td');td.append(el('span',`pill ${cls}`,lab));tr.append(td);
    tr.append(el('td','mono',r.status==='completed'?`${r.minutes}분`:'—'),el('td','mono',r.sha));t.append(tr);
  });

  const tabs=D.tabs||{},nm=k=>(tabs[k]&&tabs[k].name)||k||'(없음)';
  const bars=(node,ent,f)=>{node.replaceChildren();const mx=Math.max(1,...ent.map(e=>e[1]));
    ent.forEach(([k,v])=>{const r=el('div','bar');r.append(el('span',null,f?f(k):k));
      const tr=el('div','track'),fl=el('div','fill');fl.style.width=`${v/mx*100}%`;tr.append(fl);
      r.append(tr,el('span','n',v));node.append(r);});};
  const cats=Object.entries(D.db.by_category||{}).sort((a,b)=>b[1]-a[1]);
  $('#cat-total').textContent=`${cats.length}개 탭`;bars($('#cats'),cats,nm);

  const rows=D.db.recent||[],sel=$('#f-cat');
  sel.replaceChildren(el('option',null,'모든 탭'));sel.firstChild.value='';
  [...new Set(rows.map(r=>r.category))].forEach(c=>{const o=el('option',null,nm(c));o.value=c;sel.append(o);});
  const pt=$('#pubs');
  const draw=()=>{pt.replaceChildren();
    const ph=el('tr');['시각','탭','헤드라인','ID'].forEach(x=>ph.append(el('th',null,x)));pt.append(ph);
    const q=$('#f-q').value.trim().toLowerCase(),cat=sel.value,om=$('#f-mirror').dataset.on==='1';
    const list=rows.filter(r=>(!cat||r.category===cat)&&(!q||r.headline.toLowerCase().includes(q))&&(!om||r.mirrored));
    list.forEach(r=>{const tr=el('tr');tr.append(el('td','mono',hhmm(r.when)));
      const c=el('td');c.append(el('span','pill mute',nm(r.category)));tr.append(c);
      const hd=el('td');
      if(r.url){const a=el('a',null,r.headline);a.href=r.url;a.target='_blank';a.rel='noopener';a.style.color='inherit';hd.append(a);}
      else hd.textContent=r.headline;
      if(r.mirrored)hd.append(' ',el('span','pill ok','미러'));
      tr.append(hd,el('td','mono',r.id));pt.append(tr);});
    $('#pub-count').textContent=`${list.length} / ${rows.length}건`;};
  sel.onchange=draw;$('#f-q').oninput=draw;
  $('#f-mirror').onclick=e=>{const b=e.currentTarget;b.dataset.on=b.dataset.on==='1'?'0':'1';b.style.borderColor=b.dataset.on==='1'?'var(--patina)':'';draw();};
  $('#f-reset').onclick=()=>{sel.value='';$('#f-q').value='';$('#f-mirror').dataset.on='0';$('#f-mirror').style.borderColor='';draw();};
  draw();

  const b=D.backups||{};$('#bk-root').textContent=b.root||'';
  const box=$('#backups');box.replaceChildren();
  const bt=el('table'),bh=el('tr');['백업','용량','절차서','압축본'].forEach(x=>bh.append(el('th',null,x)));bt.append(bh);
  (b.dirs||[]).forEach(d=>{const tr=el('tr');tr.append(el('td','mono',d.name),el('td','mono',`${d.mb} MB`));
    const a=el('td');a.append(el('span',`pill ${d.has_restore?'ok':'bad'}`,d.has_restore?'RESTORE.md':'없음'));
    const c=el('td');c.append(el('span',`pill ${d.has_archive?'ok':'mute'}`,d.has_archive?'tar.gz':'없음'));
    tr.append(a,c);bt.append(tr);});
  box.append(bt);
  if((b.tags||[]).length){const p=el('p','note');p.append('git 태그: '+b.tags.join(', '));box.append(p);}
  const dir=(b.dirs||[])[0];
  $('#restore-cmd').textContent=dir?`cd ~/Desktop/HanwhaDAPnews\nmv crypto-news-bot crypto-news-bot.broken-$(date +%Y%m%d-%H%M)\ncp -a "${dir.path}/project" crypto-news-bot\ncd crypto-news-bot && python3 -m venv venv && venv/bin/pip install -r requirements.txt`:'# 백업 폴더가 없다';

  $('#gen').textContent=hhmm(D.generated_at)+' KST';
  $('#hist-n').textContent=H.length;
}

function drawChart(){
  const c=$('#chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1;
  const w=c.clientWidth,h=140;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const pts=H.filter(r=>typeof r.published==='number');
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  if(pts.length<2){ctx.fillStyle=css('--ink-3');ctx.font='12px system-ui';
    ctx.fillText('점이 2개 이상 쌓이면 그래프가 그려진다',10,24);
    $('#hist-label').textContent=`${pts.length}점`;
    $('#hist-note').textContent='봇이 폴링할 때마다 한 점씩 쌓인다.';return;}
  const xs=pts.map(p=>new Date(p.at).getTime()),ys=pts.map(p=>p.published);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const px=t=>10+(t-x0)/((x1-x0)||1)*(w-20), py=v=>h-18-(v-y0)/((y1-y0)||1)*(h-34);
  ctx.strokeStyle=css('--rule');ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=18+i*(h-34)/3;ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(px(xs[0]),py(ys[0]));
  xs.forEach((t,i)=>ctx.lineTo(px(t),py(ys[i])));
  ctx.strokeStyle=css('--patina');ctx.lineWidth=2;ctx.stroke();
  ctx.lineTo(px(xs.at(-1)),h-18);ctx.lineTo(px(xs[0]),h-18);ctx.closePath();
  ctx.globalAlpha=.12;ctx.fillStyle=css('--patina');ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(px(xs.at(-1)),py(ys.at(-1)),3.5,0,7);ctx.fillStyle=css('--patina');ctx.fill();
  $('#hist-label').textContent=`${pts.length}점 · ${hhmm(pts[0].at)} ~`;
  $('#hist-note').textContent=`기간 중 ${ys.at(-1)-ys[0]}건 늘었다. 봇이 폴링할 때마다 한 점씩 쌓인다.`;
}

$('#reload').onclick=e=>{e.currentTarget.textContent='불러오는 중…';
  load().then(()=>e.currentTarget.textContent='새로고침')
        .catch(()=>e.currentTarget.textContent='실패');};
$('#dl').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({status:D,history:H},null,2)],{type:'application/json'}));
  a.download=`bot-status-${(D?.generated_at||'').slice(0,16).replace(/[:T]/g,'')}.json`;a.click();};
addEventListener('resize',()=>{if(D)drawChart();});
load().catch(err=>{$('#boot').className='err';
  $('#boot').textContent=`상태 파일을 못 읽었다 (${err}). 봇이 아직 한 번도 갱신하지 않았거나, GitHub Pages 가 아직 배포 중이다.`;});
</script>
</body>
</html>
